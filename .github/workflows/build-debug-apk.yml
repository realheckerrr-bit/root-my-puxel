name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # These are the supported setup-android inputs. Keep the SDK package
          # names explicit so the action does not fall back to the obsolete
          # "tools" package.
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Install NDK required by AGP 9.3.1
        # AGP 9.3.1 uses NDK 28.2.13676358 as default android.ndkVersion.
        # GitHub runners pre-install a different NDK and export ANDROID_NDK_HOME to it,
        # so install the exact version AGP wants and point ANDROID_NDK_HOME at it.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Configure stable CI signing
        env:
          RMP_CI_KEYSTORE_B64: ${{ secrets.RMP_CI_KEYSTORE_B64 }}
          RMP_CI_SIGNING_PASSWORD: ${{ secrets.RMP_CI_SIGNING_PASSWORD }}
        run: |
          test -n "$RMP_CI_KEYSTORE_B64"
          test -n "$RMP_CI_SIGNING_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/root-my-pixel-ci.jks"
          echo "$RMP_CI_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "RMP_CI_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RMP_CI_SIGNING_PASSWORD=$RMP_CI_SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew ./build-all.sh

      - name: Audit bundled Pixel target matrix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          profiles = json.loads(
              (root / 'app/src/main/assets/profiles.json').read_text()
          )['profiles']
          errors = []
          seen = set()
          for profile in profiles:
              profile_id = profile['profileId']
              if profile_id in seen:
                  errors.append(f'duplicate profile id: {profile_id}')
              seen.add(profile_id)

              asset = root / 'app/src/main/assets' / profile['exploitAsset']
              if not asset.is_file():
                  errors.append(f'missing payload asset: {asset}')
              if asset.name != f'{profile_id}.so':
                  errors.append(f'asset/profile mismatch: {profile_id} -> {asset.name}')

              header = root / 'Root-My-Pixel-Payloads/src/targets' / profile_id / 'target.h'
              if not header.is_file():
                  errors.append(f'missing target header: {header}')

          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated {len(profiles)} Pixel profiles and target headers')
          PY

      - name: Audit CP3A family-critical offsets
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          profiles = json.loads(
              (Path('app/src/main/assets/profiles.json')).read_text()
          )['profiles']
          errors = []
          for profile in profiles:
              if not profile['profileId'].endswith('CP3A.260905.009'):
                  continue
              header = Path('Root-My-Pixel-Payloads/src/targets') / profile['profileId'] / 'target.h'
              text = header.read_text()
              match = re.search(
                  r'^#define\s+SELINUX_ENFORCING_OFF\s+(0x[0-9a-fA-F]+)ULL',
                  text,
                  re.MULTILINE,
              )
              expected = {
                  '6.1.': '0x0225b448',
                  '6.6.': '0x0237a0e8',
              }.get(profile['kernelRelease'][:4])
              if expected is None:
                  errors.append(f"{profile['profileId']}: unknown kernel family")
              elif not match or match.group(1).lower() != expected:
                  actual = match.group(1) if match else '<missing>'
                  errors.append(
                      f"{profile['profileId']}: SELINUX_ENFORCING_OFF {actual}, "
                      f"expected {expected}"
                  )

          if errors:
              raise SystemExit('CP3A offset audit failed:\n' + '\n'.join(errors))
          print('Validated family-critical SELinux offsets for all CP3A profiles')
          PY

      - name: Build all payloads and APK
        run: ./build-all.sh

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify session-safe payload contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = b'RMP_WORKSPACE_CONTRACT:v1'
          payloads = sorted(
              path for path in Path('app/src/main/assets/exploits').glob('*.so')
              if not path.name.startswith('cve-2026-43499-generic-')
          )
          missing = [str(path) for path in payloads if marker not in path.read_bytes()]
          if missing:
              raise SystemExit('payloads missing session workspace contract:\n' + '\n'.join(missing))
          print(f'Verified workspace contract in {len(payloads)} payloads')
          PY

      - name: Verify runtime generic payload fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for family in ('6.1', '6.6'):
              payload = Path(f'app/src/main/assets/exploits/cve-2026-43499-generic-{family}.so')
              if not payload.is_file():
                  raise SystemExit(f'missing generic payload: {payload}')
              data = payload.read_bytes()
              for marker in (b'target_config', b'CVE43499_CONFIG_PATH'):
                  if marker not in data:
                      raise SystemExit(f'{payload} missing marker {marker!r}')

          for kmi in ('android14-6.1', 'android15-6.6'):
              ksud = Path(f'app/src/main/assets/ksud/ksud-{kmi}')
              if not ksud.is_file() or ksud.stat().st_size < 1_000_000:
                  raise SystemExit(f'missing or truncated generic ksud: {ksud}')
          print('Verified generic runtime payloads for 6.1 and 6.6')
          PY

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "APK size: $(stat -c%s "$APK") bytes"
          ls -la "$APK"

      - name: Verify APK signing certificate
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
